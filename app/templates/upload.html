{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h3 class="mb-4">Загрузить торрент</h3>
                <form id="uploadForm">
                    <div class="mb-3">
                        <label>Название</label>
                        <input type="text" id="title" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Описание</label>
                        <textarea id="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label>Файл .torrent</label>
                        <input type="file" id="file" class="form-control" accept=".torrent" required>
                    </div>
                    <button type="submit" class="btn btn-success">Загрузить</button>
                </form>
                <div id="message" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script>
// Если нет токена - выкидываем на логин
if (!localStorage.getItem('access_token')) {
    window.location.href = '/login';
}

document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = localStorage.getItem('access_token');
    const formData = new FormData();

    formData.append('file', document.getElementById('file').files[0]);
    formData.append('title', document.getElementById('title').value);
    formData.append('description', document.getElementById('description').value);

    try {
        const response = await fetch('/api/v1/torrents/upload', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`
            },
            body: formData
        });

        if (response.ok) {
            window.location.href = '/';
        } else {
            document.getElementById('message').innerHTML =
                '<div class="alert alert-danger">Ошибка загрузки</div>';
        }
    } catch (err) {
        console.error(err);
    }
});
</script>
{% endblock %}
