<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Anime Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --card-shadow: rgba(0,0,0,0.1);
            --navbar-bg: #0d6efd;
            --footer-bg: #e9ecef;
            --muted-text: #6c757d;
            --input-bg: #ffffff;
            --input-border: #ced4da;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --card-bg: #1e1e1e;
                --card-shadow: rgba(0,0,0,0.4);
                --navbar-bg: #1f1f1f;
                --footer-bg: #1f1f1f;
                --muted-text: #a0a0a0;
                --input-bg: #2d2d2d;
                --input-border: #404040;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .content-wrapper {
            flex: 1;
        }

        .card {
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px var(--card-shadow);
            border: none;
        }

        .card-title, .card-text, h1, h2, h3, h4, h5, label {
            color: var(--text-color) !important;
        }

        .navbar {
            background-color: var(--navbar-bg) !important;
        }

        footer {
            background-color: var(--footer-bg) !important;
        }

        .text-muted {
            color: var(--muted-text) !important;
        }

        .form-control, .form-select {
            background-color: var(--input-bg);
            color: var(--text-color);
            border-color: var(--input-border);
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--input-bg);
            color: var(--text-color);
            border-color: #0d6efd;
        }

        .form-control::placeholder {
            color: var(--muted-text);
        }

        .card-footer {
            background-color: var(--card-bg) !important;
            border-top: 1px solid var(--input-border) !important;
        }

        .alert-info {
            background-color: var(--card-bg);
            color: var(--text-color);
            border-color: var(--input-border);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🍥 Anime Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="/">Список аниме</a></li>
                    <li class="nav-item"><a class="nav-link" href="/upload">Загрузить</a></li>
                </ul>
                <ul class="navbar-nav" id="auth-nav">
                    <li class="nav-item"><a class="nav-link" href="/login">Войти</a></li>
                    <li class="nav-item"><a class="nav-link" href="/register">Регистрация</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <footer class="py-4 mt-auto">
        <div class="container text-center">
            <small class="text-muted">Anime Tracker © 2025</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const token = localStorage.getItem('access_token');
        const authNav = document.getElementById('auth-nav');

        if (token) {
            authNav.innerHTML = `
                <li class="nav-item">
                    <a class="nav-link" href="#" onclick="logout()">Выйти</a>
                </li>
            `;
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/';
        }
    </script>
</body>
</html>
