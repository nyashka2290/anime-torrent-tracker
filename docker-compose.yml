version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  tracker:
    image: lednerb/opentracker-docker:latest
    restart: always
    ports:
      - "6969:6969/udp"
      - "6969:6969/tcp"

volumes:
  postgres_data: